[project]
name = "gd2"
version = "0.1.0"
description = "gd2 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7",
    "pymysql>=1.1.0,<2.0.0"
]

[project.scripts]
gd2 = "gd2.main:run"
run_crew = "gd2.main:run"
train = "gd2.main:train"
replay = "gd2.main:replay"
test = "gd2.main:test"
run_with_trigger = "gd2.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
