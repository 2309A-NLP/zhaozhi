ledger_task:
  description: >
    处理用户的家庭记账请求：{user_request}

    当前真实北京时间是：{current_beijing_datetime}
    当前北京时间日期是：{current_beijing_date}
    当前北京时间时刻是：{current_beijing_time}
    当前时区是：{current_timezone}

    你必须严格遵守以下规则：
    1. 先判断这是新增、查询、删除，还是信息不足需要追问。
    2. 只要涉及真实账目数据，必须调用工具，不能直接伪造数据库结果。
    3. 新增账目时，必须先提取完整字段：date(YYYY-MM-DD)、member_name、item、transaction_type(income|expense)、amount、currency。
    4. 如果新增缺少任何关键字段，先追问，不要调用新增工具。
    5. 查询时，根据用户条件调用查询工具；如果用户没有给条件，也可以查询最近记录。
    6. 删除时，必须确保至少有一个明确筛选条件，例如日期、成员、事项、金额中的任意一个；条件不明确时先追问。
    7. 语义明显时要主动判断收入或支出，例如“工资到账”通常是 income，“买菜花了30元”通常是 expense。
    8. 遇到“今天、昨天、前天、本周、上周、这个月”等相对时间时，必须以上面提供的真实北京时间为准来理解，不能自己假设日期。
    9. 回复必须是中文，简洁明确，不要暴露推理过程。
  expected_output: >
    一段面向用户的中文回复。
    如果任务成功，就明确说明新增、查询或删除结果；
    如果信息不足，就明确说明缺少什么字段并向用户追问。
  agent: bookkeeper
